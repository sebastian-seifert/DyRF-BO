seed: 1
task:
  _target_: carps.utils.task.Task
  name: yahpo/so/lcbench/167168/None
  seed: ${seed}
  objective_function:
    _target_: carps.objective_functions.yahpo.YahpoObjectiveFunction
    bench: lcbench
    instance: '167168'
    budget_type: null
    metric:
    - val_accuracy
    seed: ${seed}
  input_space:
    _target_: carps.utils.task.InputSpace
    configuration_space:
      _target_: ConfigSpace.configuration_space.ConfigurationSpace.from_serialized_dict
      _convert_: object
      d:
        name: null
        hyperparameters:
        - type: constant
          name: OpenML_task_id
          value: '167168'
          meta: null
        - type: uniform_int
          name: batch_size
          lower: 16
          upper: 512
          default_value: 91
          log: true
          meta: null
        - type: uniform_float
          name: learning_rate
          lower: 0.0001
          upper: 0.1
          default_value: 0.0031622777
          log: true
          meta: null
        - type: uniform_float
          name: max_dropout
          lower: 0.0
          upper: 1.0
          default_value: 0.5
          log: false
          meta: null
        - type: uniform_int
          name: max_units
          lower: 64
          upper: 1024
          default_value: 256
          log: true
          meta: null
        - type: uniform_float
          name: momentum
          lower: 0.1
          upper: 0.99
          default_value: 0.545
          log: false
          meta: null
        - type: uniform_int
          name: num_layers
          lower: 1
          upper: 5
          default_value: 3
          log: false
          meta: null
        - type: uniform_float
          name: weight_decay
          lower: 1.0e-05
          upper: 0.1
          default_value: 0.050005
          log: false
          meta: null
        conditions: []
        forbiddens: []
        python_module_version: 1.2.0
        format_version: 0.4
    fidelity_space:
      _target_: carps.utils.task.FidelitySpace
      is_multifidelity: false
      fidelity_type: null
      min_fidelity: null
      max_fidelity: null
    instance_space: null
  output_space:
    _target_: carps.utils.task.OutputSpace
    n_objectives: 1
    objectives:
    - val_accuracy
  optimization_resources:
    _target_: carps.utils.task.OptimizationResources
    n_trials: 2
    time_budget: null
    n_workers: 1
  metadata:
    _target_: carps.utils.task.TaskMetadata
    has_constraints: false
    domain: ML
    objective_function_approximation: surrogate
    has_virtual_time: false
    deterministic: false
    dimensions: 7
    search_space_n_categoricals: 0
    search_space_n_ordinals: 0
    search_space_n_integers: 3
    search_space_n_floats: 4
    search_space_has_conditionals: false
    search_space_has_forbiddens: false
    search_space_has_priors: false
benchmark_id: YAHPO
task_id: ${task.name}
optimizer:
  _target_: carps_integration.optimizer.CARPSDynamicRFOptimizer
  _partial_: true
  extractor_name: standard_disagreement
  n_init: 10
  kappa: 1.96
  telemetry_path: results/test_dummy_run.json
  window_size: 5
  min_samples_leaf_base: 2
  min_samples_leaf_min: 1
  min_samples_leaf_max: 15
  alpha: 1.0
  max_features_base: 0.5
  max_features_min: 0.1
  max_features_max: 0.8
  eta: 0.5
optimizer_id: CARPSDynamicRF
optimizer_container_id: CARPSDynamicRF
pyexperimenter_configuration_file_path: null
database_credential_file_path: null
use_special_conda_env: false
conda_env_name: carps_${benchmark_id}_${optimizer_container_id}
timestamp: ${now:%Y-%m-%d}/${now:%H-%M-%S}
baserundir: runs
outdir: ${baserundir}/${optimizer_id}/${benchmark_id}/${task_id}/${seed}
loggers:
- _target_: carps.loggers.file_logger.FileLogger
  _partial_: true
  overwrite: true
- _target_: carps.loggers.database_logger.DatabaseLogger
  _partial_: true
