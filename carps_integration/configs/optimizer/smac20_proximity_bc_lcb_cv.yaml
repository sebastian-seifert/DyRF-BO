# @package _global_
defaults:
  - /optimizer/smac20/base
optimizer_id: SMAC20_ProximityBC_LCB_CV
optimizer_container_id: SMAC20_ProximityBC_LCB_CV
optimizer:
  acq_func_name: "proximity_lcb"
  acq_func_kwargs:
    method: "bc"
    eps: 0.143
    level: 0.95
