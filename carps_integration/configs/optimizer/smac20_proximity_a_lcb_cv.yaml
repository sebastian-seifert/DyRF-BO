# @package _global_
defaults:
  - /optimizer/smac20/base
optimizer_id: SMAC20_ProximityA_LCB_CV
optimizer_container_id: SMAC20_ProximityA_LCB_CV
optimizer:
  acq_func_name: "proximity_lcb"
  acq_func_kwargs:
    method: "a"
    k: 28
    k_warmup: 28
    eps: 0.081
    level: 0.95
  smac_cfg:
    smac_class: smac.facade.HyperparameterOptimizationFacade
    model_class: carps_integration.custom_uncertainty_model.CustomUncertaintyRandomForest
    model_kwargs:
      uncertainty_func: "standard_proximity_cv"
      extractor_kwargs:
        decay_lambda: 0.205
